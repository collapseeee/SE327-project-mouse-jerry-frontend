version = 1

test_patterns = [
  "src/**/__tests__/**",
  "src/**/*.spec.ts",
  "src/**/*.test.ts"
]

exclude_patterns = [
  "dist/**",
  "node_modules/**",
  "coverage/**"
]

[[analyzers]]
name = "javascript"
enabled = true

[analyzers.meta]
environment = [
  "nodejs",
  "browser"
]
plugins = [
  "typescript"
]

[[analyzers]]
name = "secrets"
enabled = true
